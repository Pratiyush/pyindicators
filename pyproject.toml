[project]
name = "pyindicators"
version = "0.1.0"
description = "Modular, look-ahead-safe technical-indicator library for pandas/numpy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pratiyush", email = "pratiyush1@gmail.com" }]
keywords = ["technical-analysis", "indicators", "trading", "finance", "quant", "pandas", "ta"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "hypothesis>=6.100", "pytest-cov>=5.0", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/Pratiyush/pyindicators"
Repository = "https://github.com/Pratiyush/pyindicators"
Issues = "https://github.com/Pratiyush/pyindicators/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyindicators"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "tests"]

[tool.coverage.run]
source = ["pyindicators"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError", "@(abc\\.)?abstractmethod"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["pyindicators"]
